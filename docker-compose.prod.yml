services:
  db:
    image: postgres:15-alpine
    container_name: car_dealership_backend
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: car_dealership_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

  django:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: car_dealership_django
    command: gunicorn config.wsgi:application -c gunicorn.conf.py
    volumes:
      - static_volume:/usr/src/app/staticfiles
      - media_volume:/usr/src/app/media
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - backend

  nginx:
    image: nginx:alpine
    container_name: car_dealership_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/usr/src/app/staticfiles:ro
      - media_volume:/usr/src/app/media:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      django:
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - backend

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: car_dealership_celery_worker
    command: celery -A config worker -l info
    volumes:
      - ./:/usr/src/app
    env_file:
      - .env.prod
    depends_on:
      - django
      - redis
    restart: unless-stopped
    networks:
      - backend

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: car_dealership_celery_beat
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./:/usr/src/app
    env_file:
      - .env.prod
    depends_on:
      - django
      - redis
    restart: unless-stopped
    networks:
      - backend

  flower:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: car_dealership_flower
    command: celery -A config flower --port=5555
    ports:
      - "5555:5555"
    env_file:
      - .env.prod
    depends_on:
      - redis
      - celery_worker
    restart: unless-stopped
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  backend:
    driver: bridge